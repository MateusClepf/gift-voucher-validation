<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift Voucher Validation</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Load Turnstile script without defer to ensure it's loaded before our script -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"></script>
</head>
<body>
    <div class="container">
        <h1>Gift Voucher Validation</h1>
        <div class="voucher-form">
            <input type="text" id="voucher-code" placeholder="Enter voucher code" maxlength="10">
            <button id="validate-btn">Validate</button>
            <!-- Add a specific validation section for both loading and turnstile -->
            <div id="validation-section" class="hidden">
                <div id="loading" class="hidden">
                    <p>Loading security check...</p>
                </div>
                <div id="turnstile-container"></div>
            </div>
        </div>
        <div id="result" class="result-hidden">
            <div id="result-message"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
